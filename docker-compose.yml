version: '3.9'

services:
  backend:
    backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pneumonia_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - MODEL_PATH=/app/pneumonia_model.pth
    restart: unless-stopped
  fronted:
    build: ./frontend
    container_name: pneumonia-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend